name: Build Happy Bingo for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, feature/one-time-licensing]

jobs:
  build-customer-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install customer app dependencies
        run: npm install
      - name: Build customer app renderer, main and preload
        run: npm run build
      - name: Verify customer app inputs
        shell: pwsh
        run: |
          if (-not (Test-Path "out/main/index.js")) { throw "Missing out/main/index.js" }
          if (-not (Test-Path "out/preload/index.mjs")) { throw "Missing out/preload/index.mjs" }
          if (-not (Test-Path "out/renderer/index.html")) { throw "Missing out/renderer/index.html" }
          if (-not (Test-Path "audio/voices")) { throw "Missing audio/voices directory" }
          $voices = Get-ChildItem "audio/voices" -Filter *.mp3 -File
          if ($voices.Count -lt 79) { throw "Expected at least 79 MP3 voices, found $($voices.Count)" }
          Write-Host "Verified customer app and $($voices.Count) MP3 voice files."
      - name: Build customer Windows installer
        run: npx electron-builder --win --publish never
      - name: Verify customer installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/*.exe" -File
          if (-not $exe) { throw "Customer Windows installer was not produced" }
      - name: Upload customer app
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Bingo-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-card-setup:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: card-setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install private setup dependencies
        run: npm install
      - name: Verify setup app files
        shell: pwsh
        run: |
          foreach ($f in @('main.cjs','preload.cjs','index.html','renderer.js','styles.css','package.json')) {
            if (-not (Test-Path $f)) { throw "Missing setup file: $f" }
          }
      - name: Build private Card Setup installer
        run: npx electron-builder --win --publish never
      - name: Verify Card Setup installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/*.exe" -File
          if (-not $exe) { throw "Card Setup Windows installer was not produced" }
      - name: Upload private Card Setup app
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Bingo-Card-Setup-Windows
          path: |
            card-setup/dist/*.exe
            card-setup/dist/*.zip
          if-no-files-found: error
