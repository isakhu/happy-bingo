name: Build Happy Bingo for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-customer-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install customer app dependencies
        run: npm install
      - name: Build customer app renderer, main and preload
        run: npm run build
      - name: Verify customer app inputs
        shell: pwsh
        run: |
          if (-not (Test-Path "out/main/index.js")) { throw "Missing out/main/index.js" }
          if (-not (Test-Path "out/preload/index.mjs")) { throw "Missing out/preload/index.mjs" }
          if (-not (Test-Path "out/renderer/index.html")) { throw "Missing out/renderer/index.html" }
          if (-not (Test-Path "audio/voices")) { throw "Missing audio/voices directory" }
          $voices = Get-ChildItem "audio/voices" -Filter *.mp3 -File
          if ($voices.Count -ne 79) { throw "Expected exactly 79 MP3 voices (75 numbers + 4 system voices), found $($voices.Count)" }
          foreach ($required in @('Goodbingo.mp3','cartellawu.mp3','chewatawu.mp3','pause.mp3','b1.mp3','i16.mp3','n31.mp3','g46.mp3','o61.mp3')) {
            if (-not (Test-Path "audio/voices/$required")) { throw "Missing required voice $required" }
          }
          $cards = Get-Content "src/main/customer-cards.ts" -Raw
          $cardMatches = [regex]::Matches($cards, '\{id:\d+,values:\[')
          if ($cardMatches.Count -ne 100) { throw "Expected exactly 100 bundled customer cards, found $($cardMatches.Count)" }
          Write-Host "Verified 100 customer cards and exactly 79 voice files."
      - name: Verify release safety rules
        shell: pwsh
        run: |
          $html = Get-Content "out/renderer/index.html" -Raw
          $startupCss = Get-Content "src/renderer/startup-theme-fix.css" -Raw
          $selectionSummary = Get-Content "src/renderer/src/selection-summary.js" -Raw
          $fallback = Get-Content "src/renderer/src/startup-fallback.js" -Raw
          $package = Get-Content "package.json" -Raw
          if ($html -notmatch "startup-theme-fix\.css") { throw "Startup theme guard is not included in renderer HTML" }
          if ($startupCss -notmatch "#071a3a" -or $startupCss -notmatch "\.app-shell::before" -or $startupCss -notmatch "\.app-shell::after") { throw "Startup dark-shell safety rules are missing" }
          if ($selectionSummary -match 'STARTING_MONEY\s*=\s*10000000' -or $selectionSummary -match 'STARTING_MONEY\s*=\s*1000000') { throw "Legacy money seed remains in selection-summary.js" }
          if ($fallback -match "happy-bingo-total-money'.*10000000" -or $fallback -match "happy-bingo-money-balance'.*10000000") { throw "Legacy 10 million seed remains in startup fallback" }
          if ($package -notmatch '"audio/\*\*/\*"') { throw "Packaged build is not configured to include audio assets" }
          Write-Host "Verified startup protection, money migration rules, and packaged audio configuration."
      - name: Verify authentication wiring
        shell: pwsh
        run: |
          $main = Get-Content "out/main/index.js" -Raw
          $preload = Get-Content "out/preload/index.mjs" -Raw
          $rendererHtml = Get-Content "out/renderer/index.html" -Raw
          $rendererJsFiles = Get-ChildItem "out/renderer/assets/*.js" -File -ErrorAction SilentlyContinue
          if (-not $rendererJsFiles) { throw "Renderer JavaScript bundle is missing" }
          $rendererJs = ($rendererJsFiles | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if ($main -notmatch "auth-status" -or $main -notmatch "auth-setup" -or $main -notmatch "auth-unlock") { throw "Main authentication IPC handlers are missing" }
          if ($preload -notmatch "auth-status" -or $preload -notmatch "auth-setup" -or $preload -notmatch "auth-unlock") { throw "Preload authentication bridge is missing" }
          if ($rendererHtml -notmatch "index-.*\.js" -or $rendererJs -notmatch "happyBingoAuth" -or $rendererJs -notmatch "FIRST-TIME SETUP" -or $rendererJs -notmatch "ENTER PASSWORD") { throw "Renderer authentication guard was not included in the production bundle" }
          Write-Host "Verified authentication main/preload/renderer wiring."
      - name: Build customer Windows installer
        run: npx electron-builder --win --publish never
      - name: Verify customer installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/*.exe" -File
          if (-not $exe) { throw "Customer Windows installer was not produced" }
      - name: Upload customer app
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Bingo-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
