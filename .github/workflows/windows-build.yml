name: Build Happy Bingo for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happy-bingo-windows
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.zip
            dist/**/*.blockmap
          if-no-files-found: warn
