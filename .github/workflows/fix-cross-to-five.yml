name: Fix Cross to five cells

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Cross to five cells'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Cross to exactly five cells
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/renderer/src/main.tsx')
          s = p.read_text(encoding='utf-8')
          old = "{label:'Cross',indexes:[2,7,10,11,12,13,14,17,22]}"
          new = "{label:'Cross',indexes:[7,11,12,13,17]}"
          if old not in s:
              raise SystemExit('Expected 9-cell Cross pattern was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/fix-cross-to-five.yml
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/main.tsx .github/workflows/fix-cross-to-five.yml
          git commit -m "Fix Cross to five cells"
          git push
