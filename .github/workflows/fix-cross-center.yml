name: Fix Cross Bingo center pattern

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Cross Bingo center pattern'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Cross pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/renderer/src/main.tsx')
          s = p.read_text(encoding='utf-8')
          old = "{label:'Cross',indexes:[0,1,2,3,4,7,12,17,22]}"
          new = "{label:'Cross',indexes:[2,7,10,11,12,13,14,17,22]}"
          if old not in s:
              raise SystemExit('The previous Cross pattern was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-cross-center.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/main.tsx .github/workflows/fix-cross-center.yml
          git commit -m "Fix Cross Bingo center pattern"
          git push
