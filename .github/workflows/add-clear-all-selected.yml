name: Add Clear All Selected button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Add Clear All Selected Cartella button'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clear all button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/renderer/src/main.tsx')
          s=p.read_text(encoding='utf-8')
          old="<div className=\"selection-count\"><b>{selected.size}</b><span>SELECTED</span></div></div>"
          new="<div className=\"selection-count\"><b>{selected.size}</b><span>SELECTED</span><button type=\"button\" className=\"clear-selection-button\" onClick={()=>setSelected(new Set())} disabled={!selected.size}>CLEAR ALL SELECTED</button></div></div>"
          if old not in s:
              raise SystemExit('Selection count block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add button styling
        shell: bash
        run: |
          cat >> src/renderer/src/final-fixes.css <<'CSS'
          .clear-selection-button{display:block;margin-top:8px;border:1px solid #e53935;border-radius:7px;background:#2a2020;color:#fff;padding:6px 9px;font-size:8px;font-weight:1000;letter-spacing:.4px;cursor:pointer}
          .clear-selection-button:hover:not(:disabled){background:#e53935}
          .clear-selection-button:disabled{opacity:.35;cursor:not-allowed}
          CSS
      - name: Remove workflow
        shell: bash
        run: rm .github/workflows/add-clear-all-selected.yml
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/main.tsx src/renderer/src/final-fixes.css .github/workflows/add-clear-all-selected.yml
          git commit -m "Add Clear All Selected Cartella button"
          git push