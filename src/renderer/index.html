<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Bingo</title>
    <link rel="stylesheet" href="./src/revenue-dashboard.css" />
    <link rel="stylesheet" href="./src/settings-legacy.css" />
    <link rel="stylesheet" href="./src/board-balls.css" />
    <link rel="stylesheet" href="./payout-hide.css" />
    <link rel="stylesheet" href="./src/amount-ball.css" />
    <link rel="stylesheet" href="./src/header-logo-layout.css" />
    <link rel="stylesheet" href="./src/recent-ball-colors.css" />
    <link rel="stylesheet" href="./src/recent-calls-compact.css" />
    <link rel="stylesheet" href="./src/recent-ball-layout.css" />
    <link rel="stylesheet" href="./src/visual-overhaul.css" />
    <link rel="stylesheet" href="./src/casino-arcade-theme.css" />
    <link rel="stylesheet" href="./src/main-metrics-safe.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./cartella-settings-clear.js"></script>
    <script type="module" src="./revenue-dashboard.js"></script>
    <script type="module" src="./money-menu.js"></script>
    <script type="module" src="./src/amount-ball.js"></script>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const compact = document.createElement('link')
        compact.rel = 'stylesheet'
        compact.href = './src/recent-calls-compact.css'
        document.head.appendChild(compact)

        const link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = './src/pointer-ownership.css'
        document.head.appendChild(link)

        const nearCurrent = document.createElement('link')
        nearCurrent.rel = 'stylesheet'
        nearCurrent.href = './src/recent-near-current.css'
        document.head.appendChild(nearCurrent)

        const totalAmount = document.createElement('link')
        totalAmount.rel = 'stylesheet'
        totalAmount.href = './src/total-amount-white-fixed.css'
        document.head.appendChild(totalAmount)

        const settingsInteraction = document.createElement('link')
        settingsInteraction.rel = 'stylesheet'
        settingsInteraction.href = './src/settings-interaction-final.css'
        document.head.appendChild(settingsInteraction)

        const gameInteraction = document.createElement('link')
        gameInteraction.rel = 'stylesheet'
        gameInteraction.href = './src/final-game-interaction.css'
        document.head.appendChild(gameInteraction)

        const logo = document.createElement('link')
        logo.rel = 'stylesheet'
        logo.href = './src/happy-bingo-logo-final.css'
        document.head.appendChild(logo)

        const headerLayout = document.createElement('link')
        headerLayout.rel = 'stylesheet'
        headerLayout.href = './src/header-layout-final.css'
        document.head.appendChild(headerLayout)
      }, { once: true })
    </script>
  </body>
</html>
