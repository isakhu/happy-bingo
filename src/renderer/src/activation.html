<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Bingo Activation</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5ff;font-family:Segoe UI,Arial,sans-serif;color:#12233f}.card{width:min(520px,calc(100vw - 48px));padding:34px;border-radius:22px;background:white;box-shadow:0 18px 50px #153a6822}h1{margin:0 0 6px;font-size:30px}p{color:#62728a}textarea{width:100%;height:130px;box-sizing:border-box;padding:14px;border:2px solid #d7e1ef;border-radius:12px;resize:none;font:14px monospace}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#1464f4;color:white;font-weight:800;font-size:15px;cursor:pointer}#status{min-height:22px;margin-top:14px;color:#c0392b}.small{font-size:12px;color:#8090a5}</style>
</head><body><main class="card"><h1>HAPPY BINGO</h1><p>Activate this copy of Happy Bingo once using the license key supplied with your purchase.</p><textarea id="key" spellcheck="false" placeholder="Paste your license key here"></textarea><button id="activate">ACTIVATE HAPPY BINGO</button><div id="status"></div><div class="small">Activation is verified offline and stored securely on this Windows account.</div></main><script>document.getElementById('activate').onclick=async()=>{const key=document.getElementById('key').value.trim();const s=document.getElementById('status');s.textContent='Checking license…';const r=await window.happyBingoActivation.submit(key);s.textContent=r.ok?'Activated. Opening Happy Bingo…':r.error||'Activation failed.'};</script></body></html>
