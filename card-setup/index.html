<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Bingo Card Setup</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="logo"><span>★HAPPY</span><b>BINGO</b><i>●</i><i>●</i><i>●</i></div><div class="subtitle">PRIVATE CUSTOMER CARTELLA SETUP</div></header><main><section class="toolbar"><div><small>CUSTOMER SET</small><input id="setId" value="HB-001" maxlength="20"></div><div class="jump"><small>GO TO CARTELLA</small><input id="jump" value="1" inputmode="numeric"><button id="go">GO</button></div><div class="status" id="status">0 / 100 VALID</div></section><section class="workspace"><aside><div class="card-number">CARTELLA <strong id="cardNo">001</strong><span>/ 100</span></div><div class="legend"><div><b>B</b> 1–15</div><div><b>I</b> 16–30</div><div><b>N</b> 31–45</div><div><b>G</b> 46–60</div><div><b>O</b> 61–75</div></div><p>Enter the numbers exactly as they appear on the customer's printed card. The center is always FREE.</p></aside><section><div class="cartella"><div class="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div><div id="grid" class="grid"></div></div><div id="message" class="message"></div></section></section><section class="actions"><button id="prev">← PREVIOUS</button><button id="next">NEXT →</button><button id="clear" class="secondary">CLEAR CARD</button><button id="open" class="secondary">OPEN SET</button><button id="export" class="secondary">EXPORT .HBC</button><button id="install" class="primary">INSTALL FOR HAPPY BINGO</button></section></main><script src="renderer.js"></script></body></html>
